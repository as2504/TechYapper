<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TechYapper — Know tech. Talk tech. Yap tech.</title>
    <meta name="description" content="A daily tech knowledge habit for developers. One concept in three levels, a five-question battle and a code challenge, every day. 10–15 minutes." />
    <meta name="theme-color" content="#F3EFE6" />
    <script>
      // Apply the saved or system theme before first paint (no flash).
      try {
        var t = localStorage.getItem('ty:theme') || 'system'
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) { document.documentElement.dataset.theme = 'dark'; document.querySelector('meta[name=theme-color]').content = '#131210' }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="TechYapper — Know tech. Talk tech. Yap tech." />
    <meta property="og:description" content="Learn one thing today. Have something interesting to say tomorrow." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
